name: PomConsistencyCheck

on:
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checks versions
        run: installation/build/checkPomConsistency.py .
      
      - name: Checks third party consistency 
        run: installation/build/checkThirdPartyDependencies.py installation/build/pom.xml installation/build/third_parties.pom.xml com.gip.xyna.*